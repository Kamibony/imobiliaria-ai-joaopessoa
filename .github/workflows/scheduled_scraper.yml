name: Scheduled Scraper Pipeline

on:
  workflow_dispatch:
    inputs:
      target_missing_units:
        description: 'Target existing projects missing units/summary'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 2 * * 0'

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: 'read'
      id-token: 'write'
    defaults:
      run:
        working-directory: ./scraper

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync

      - name: Install Playwright Browsers
        run: uv run playwright install chromium --with-deps

      - id: 'auth'
        name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: '${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.GCP_SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Execute Crawler
        run: uv run main.py ${{ github.event.inputs.target_missing_units == 'true' && '--target-missing-units' || '' }}

      - name: Generate Run Summary
        if: always()
        run: uv run summary_generator.py
